<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orbit Cursor Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    color: #fff;
    gap: 60px;
    padding: 60px 40px;
  }

  h1 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
  }

  .states {
    display: flex;
    gap: 80px;
    align-items: center;
  }

  .state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }

  /* ── shared dot ── */
  .canvas {
    width: 60px;
    height: 60px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,0.93);
    position: absolute;
    z-index: 10;
  }

  /* ── idle: pulsing glow halo ── */
  .glow {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: rgba(255,255,255,0.22);
    position: absolute;
    filter: blur(3.5px);
    animation: glow-pulse 4s ease-in-out infinite;
  }

  @keyframes glow-pulse {
    0%, 100% { transform: scale(1);   opacity: 1; }
    50%       { transform: scale(1.35); opacity: 0.7; }
  }

  /* ── listening: expanding ring ── */
  .ring {
    border-radius: 50%;
    border: 1.2px solid rgba(255,255,255,0.75);
    position: absolute;
    animation: ring-expand 1.2s cubic-bezier(0.2,0,0.8,1) infinite;
  }

  @keyframes ring-expand {
    0%   { width: 5px;  height: 5px;  opacity: 0.75; border-width: 1.2px; }
    100% { width: 27px; height: 27px; opacity: 0;    border-width: 0.5px; }
  }

  /* audio reactive: second ring, offset phase */
  .ring-2 {
    animation-delay: 0.4s;
    opacity: 0;
  }

  /* ── processing: spinning arc on 13pt rail ── */
  .rail {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 0.7px solid rgba(255,255,255,0.1);
    position: absolute;
  }

  .arc-wrapper {
    width: 13px;
    height: 13px;
    position: absolute;
    animation: spin 0.9s linear infinite;
  }

  .arc {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 0.9px solid transparent;
    border-top-color: rgba(255,255,255,0.88);
    border-right-color: rgba(255,255,255,0.3);
    position: absolute;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ── divider ── */
  .divider {
    width: 1px;
    height: 60px;
    background: rgba(255,255,255,0.08);
  }

  /* ── size comparison ── */
  .comparison {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .old-mark {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.5;
  }

  .arrow {
    font-size: 16px;
    color: rgba(255,255,255,0.25);
  }

  .new-dot-solo {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .size-label {
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    text-align: center;
    margin-top: 8px;
    letter-spacing: 0.05em;
  }

  .size-col {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
</style>
</head>
<body>

<h1>Orbit Cursor &mdash; New Dot Design</h1>

<div class="states">

  <!-- IDLE -->
  <div class="state">
    <div class="canvas">
      <div class="glow"></div>
      <div class="dot"></div>
    </div>
    <div class="label">Idle</div>
  </div>

  <div class="divider"></div>

  <!-- LISTENING -->
  <div class="state">
    <div class="canvas">
      <div class="ring"></div>
      <div class="ring ring-2"></div>
      <div class="dot"></div>
    </div>
    <div class="label">Listening</div>
  </div>

  <div class="divider"></div>

  <!-- PROCESSING -->
  <div class="state">
    <div class="canvas">
      <div class="rail"></div>
      <div class="arc-wrapper">
        <div class="arc"></div>
      </div>
      <div class="dot"></div>
    </div>
    <div class="label">Processing</div>
  </div>

</div>

<!-- Size comparison -->
<div style="display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:12px;">
  <div style="font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.2);">Size comparison</div>
  <div class="comparison">
    <div class="size-col">
      <!-- Old Orbit mark approximation via SVG -->
      <svg width="28" height="28" viewBox="0 0 28 28" style="opacity:0.45;">
        <polygon
          points="6,26 12,28 0,0 28,12 26,6 12,12"
          fill="#111"
          stroke="white"
          stroke-width="1.54"
          stroke-linejoin="round"
          fill-rule="evenodd"
        />
      </svg>
      <div class="size-label">Before<br>28 × 28 pt</div>
    </div>
    <div class="arrow">→</div>
    <div class="size-col">
      <div style="width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.93);box-shadow:0 0 6px 2px rgba(255,255,255,0.3);"></div>
      <div class="size-label">After<br>5 pt dot</div>
    </div>
  </div>
</div>

</body>
</html>
